<section class="education" aria-labelledby="education-title">
  <div class="education__content">
    <p class="education__eyebrow">Education</p>
    <h2 id="education-title">{{ education.institution }}</h2>

    <article class="education-card">
      <div class="education-card__summary">
        <h3>{{ education.degree }}</h3>
        <p>{{ education.secondaryStudy }}</p>
      </div>
      <span>{{ education.graduation }}</span>

      <div class="education-card__details" aria-label="Education details">
        <div *ngFor="let detail of education.details">
          <h4>{{ detail.label }}</h4>
          <p>{{ detail.value }}</p>
        </div>
      </div>
    </article>
  </div>
</section>
