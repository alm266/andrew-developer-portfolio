<section class="experience" aria-labelledby="experience-title">
  <div class="experience__content">
    <p class="experience__eyebrow">Professional experience</p>
    <h2 id="experience-title">Engineering roles across web tools, internal platforms, and interactive software.</h2>

    <div class="experience__list">
      <app-experience-card
        *ngFor="let entry of entries"
        [entry]="entry"
      ></app-experience-card>
    </div>
  </div>
</section>
