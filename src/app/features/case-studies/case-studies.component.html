<main class="page">
  <section class="page__header" aria-labelledby="case-studies-title">
    <div class="page__header-content">
      <p class="page__eyebrow">Case Studies</p>
      <h1 id="case-studies-title">Design and product stories with the decisions left in.</h1>
      <p>
        Longer-form breakdowns for product thinking, interface decisions, design systems,
        constraints, implementation details, and what changed along the way.
      </p>
    </div>
  </section>

  <section class="case-studies" aria-labelledby="case-studies-list-title">
    <div class="case-studies__content">
      <div class="case-studies__intro">
        <p class="case-studies__eyebrow">Case Studies</p>
        <h2 id="case-studies-list-title">Project breakdowns and product decisions.</h2>
      </div>

      <div class="case-studies__layout">
        <app-table-of-contents
          [items]="tableOfContentsItems"
        ></app-table-of-contents>

        <div class="case-studies__list">
          <app-article-card
            *ngFor="let caseStudy of caseStudies; let index = index"
            [article]="caseStudy"
            [articleId]="getCaseStudyId(caseStudy, index)"
          ></app-article-card>
        </div>
      </div>
    </div>
  </section>
</main>
